<template>
    <lightning-card title="New Property" icon-name="standard:realestate">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <div class="slds-grid slds-gutters slds-wrap">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input label="Property Name" data-field="name" value={name} onchange={handleFieldChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input label="Rent" type="number" step="0.01" required data-field="rent" value={rent} onchange={handleFieldChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input label="Address" required data-field="address" value={address} onchange={handleFieldChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input label="City" required data-field="city" value={city} onchange={handleFieldChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input label="State" required data-field="state" value={state} onchange={handleFieldChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input label="Postal Code" required data-field="postalCode" value={postalCode} onchange={handleFieldChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input label="Country" required data-field="country" value={country} onchange={handleFieldChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox label="Type" required options={typeOptions} data-field="type" value={type} onchange={handlePicklistChange}></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox label="Furnishing Status" options={furnishingOptions} data-field="furnishingStatus" value={furnishingStatus} onchange={handlePicklistChange}></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox label="Status" required options={statusOptions} data-field="status" value={status} onchange={handlePicklistChange}></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1">
                    <lightning-textarea label="Description" required data-field="description" value={description} onchange={handleFieldChange}></lightning-textarea>
                </div>
                <div class="slds-col slds-size_1-of-1">
                    <div class="slds-grid slds-grid_vertical-align-center slds-m-top_small">
                        <label class="slds-form-element__label slds-m-bottom_none">
                            Property Images
                            <abbr class="slds-required" title="required">*</abbr>
                        </label>

                        <lightning-button
                            class="slds-m-left_small"
                            label="Upload Images"
                            icon-name="utility:upload"
                            variant="brand"
                            onclick={openFilePicker}>
                        </lightning-button>
                    </div>

                    <input
                        class="hidden-file-input"
                        type="file"
                        accept="image/*"
                        multiple
                        onchange={handleFileChange} />

                    <template if:true={hasImages}>
                        <div class="slds-m-top_medium">
                            <div class="slds-grid slds-wrap slds-gutters_small">
                                <template for:each={images} for:item="image" for:index="index">
                                    <div key={image.fileName} class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                                        <div class="slds-box slds-text-align_center">
                                            <img
                                                src={image.previewUrl}
                                                alt={image.fileName}
                                                style="width:100%; height:140px; object-fit:cover; border-radius:4px;" />

                                            <div
                                                class="slds-truncate slds-m-top_x-small"
                                                title={image.fileName}>
                                                {image.fileName}
                                            </div>

                                            <lightning-button-icon
                                                icon-name="utility:delete"
                                                alternative-text="Remove"
                                                title="Remove Image"
                                                variant="border-filled"
                                                class="slds-m-top_x-small"
                                                data-index={index}
                                                onclick={removeImage}>
                                            </lightning-button-icon>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <div class="slds-m-top_medium">
                <lightning-button variant="brand" label="Save Property" onclick={handleSave} disabled={isSaveDisabled}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
